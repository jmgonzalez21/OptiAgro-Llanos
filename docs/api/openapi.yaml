    EjecutarExactoRequest:
      type: object
      properties:
        escenario_id:
          type: integer
          description: Usa la instantánea de un escenario guardado en vez de la red
            actual.
        guardar:
          type: boolean
          default: true
          description: Registrar la ejecución en el historial.
        modo_oferta:
          allOf:
          - $ref: '#/components/schemas/ModoOfertaEnum'
          default: exact
          description: |-
            exact: toda la oferta se retira (=); maximum: (<=).

            * `exact` - exact
            * `maximum` - maximum
    EjecutarGeneticoRequest:
      type: object
      properties:
        escenario_id:
          type: integer
          description: Usa la instantánea de un escenario guardado en vez de la red
            actual.
        guardar:
          type: boolean
          default: true
          description: Registrar la ejecución en el historial.
        poblacion:
          type: integer
          maximum: 300
          minimum: 2
          default: 60
        generaciones:
          type: integer
          maximum: 1000
          minimum: 1
          default: 150
        cruce:
          type: number
          format: double
          maximum: 1
          minimum: 0
          default: 0.8
          description: Probabilidad de cruce por pareja.
        mutacion:
          type: number
          format: double
          maximum: 1
          minimum: 0
          default: 0.12
          description: Probabilidad de mutación por gen.
        semilla:
          type: integer
          maximum: 2147483647
          minimum: 0
          default: 42
        elitismo:
          type: integer
          minimum: 0
          default: 2
          description: Individuos que pasan intactos; < población.
        seleccion:
          allOf:
          - $ref: '#/components/schemas/SeleccionEnum'
          default: torneo
          description: |-
            torneo: gana el mejor de tamano_torneo individuos; ruleta: proporcional a la aptitud (con escalamiento).

            * `torneo` - torneo
            * `ruleta` - ruleta
        tipo_cruce:
          allOf:
          - $ref: '#/components/schemas/TipoCruceEnum'
          default: un_punto
          description: |-
            Cruce de uno o de dos puntos.

            * `un_punto` - un_punto
            * `dos_puntos` - dos_puntos
        tamano_torneo:
          type: integer
          minimum: 2
          default: 3
          description: Solo con seleccion=torneo; <= población.
        inicializacion:
          allOf:
          - $ref: '#/components/schemas/InicializacionEnum'
          default: aleatoria
          description: |-
            aleatoria (línea base) o heuristica (parte de la población sesgada hacia rutas baratas).

            * `aleatoria` - aleatoria
            * `heuristica` - heuristica
