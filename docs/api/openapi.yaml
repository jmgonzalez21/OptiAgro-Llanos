components:
  schemas:
    AnalisisPlanta:
      type: object
      properties:
        planta:
          type: string
        nombre:
          type: string
        tipo_demanda:
          type: string
        capacidad:
          type: number
          format: double
        flujo:
          type: number
          format: double
        utilizacion_pct:
          type: number
          format: double
          nullable: true
        precio_sombra:
          type: number
          format: double
          nullable: true
        cuello_de_botella:
          type: boolean
      required:
      - capacidad
      - cuello_de_botella
      - flujo
      - nombre
      - planta
      - precio_sombra
      - tipo_demanda
      - utilizacion_pct
    Asignacion:
      type: object
      properties:
        empresa_id:
          type: string
        planta_id:
          type: string
        cantidad:
          type: number
          format: double
        costo_unitario:
          type: number
          format: double
          description: Costo efectivo COP/t = transporte + operación + precio.
        costo_transporte:
          type: number
          format: double
          description: distancia x tarifa, o costo unitario directo.
        costo_operacion:
          type: number
          format: double
          description: costo_operacion_ton de la planta.
        precio_tonelada:
          type: number
          format: double
          description: precio_tonelada de la empresa.
      required:
      - cantidad
      - costo_unitario
      - empresa_id
      - planta_id
    BaseSensibilidad:
      type: object
      properties:
        exacto:
          $ref: '#/components/schemas/ResumenSolucion'
        genetico:
          allOf:
          - $ref: '#/components/schemas/ResumenSolucion'
          nullable: true
        gap_pct:
          type: number
          format: double
          nullable: true
      required:
      - exacto
      - gap_pct
      - genetico
    CambiarContrasenaRequest:
      type: object
      properties:
        contrasena_actual:
          type: string
          writeOnly: true
          minLength: 1
        contrasena_nueva:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - contrasena_actual
      - contrasena_nueva
    CambiarContrasenaRespuesta:
      type: object
      properties:
        detail:
          type: string
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - detail
      - refresh
    CambioAsignacion:
      type: object
      properties:
        empresa:
          type: string
        planta:
          type: string
        base:
          type: number
          format: double
          description: Toneladas en el caso base (exacto).
        escenario:
          type: number
          format: double
          description: Toneladas en el escenario (exacto).
        delta:
          type: number
          format: double
      required:
      - base
      - delta
      - empresa
      - escenario
      - planta
    CeldaMatrizLectura:
      type: object
      properties:
        empresa:
          type: string
        planta:
          type: string
        costo_unitario:
          type: number
          format: double
          nullable: true
        distancia_km:
          type: number
          format: double
          nullable: true
        tarifa_km_ton:
          type: number
          format: double
          nullable: true
        limite:
          type: number
          format: double
          nullable: true
        activa:
          type: boolean
      required:
      - activa
      - costo_unitario
      - distancia_km
      - empresa
      - limite
      - planta
      - tarifa_km_ton
    CeldaMatrizRequest:
      type: object
      properties:
        empresa:
          type: string
          minLength: 1
          description: Código de la empresa.
        planta:
          type: string
          minLength: 1
          description: Código de la planta.
        costo_unitario:
          type: number
          format: double
          minimum: 0
          nullable: true
        distancia_km:
          type: number
          format: double
          minimum: 0
          nullable: true
        tarifa_km_ton:
          type: number
          format: double
          minimum: 0
          nullable: true
        limite:
          type: number
          format: double
          minimum: 0
          nullable: true
        activa:
          type: boolean
      required:
      - empresa
      - planta
    Comparacion:
      type: object
      properties:
        diferencia_costo:
          type: number
          format: double
          nullable: true
        gap_pct:
          type: number
          format: double
          nullable: true
          description: (AG - exacto) / exacto x 100.
        ratio_tiempo:
          type: number
          format: double
          nullable: true
          description: tiempo AG / tiempo exacto.
        ag_alcanza_optimo:
          type: boolean
      required:
      - ag_alcanza_optimo
      - diferencia_costo
      - gap_pct
      - ratio_tiempo
    ConfigAG:
      type: object
      properties:
        poblacion:
          type: integer
          maximum: 300
          minimum: 2
          default: 60
        generaciones:
          type: integer
          maximum: 1000
          minimum: 1
          default: 150
        cruce:
          type: number
          format: double
          maximum: 1
          minimum: 0
          default: 0.8
          description: Probabilidad de cruce por pareja.
        mutacion:
          type: number
          format: double
          maximum: 1
          minimum: 0
          default: 0.12
          description: Probabilidad de mutación por gen.
        semilla:
          type: integer
          maximum: 2147483647
          minimum: 0
          default: 42
        elitismo:
          type: integer
          minimum: 0
          default: 2
          description: Individuos que pasan intactos; < población.
        seleccion:
          allOf:
          - $ref: '#/components/schemas/SeleccionEnum'
          default: torneo
          description: |-
            torneo: gana el mejor de tamano_torneo individuos; ruleta: proporcional a la aptitud (con escalamiento).

            * `torneo` - torneo
            * `ruleta` - ruleta
        tipo_cruce:
          allOf:
          - $ref: '#/components/schemas/TipoCruceEnum'
          default: un_punto
          description: |-
            Cruce de uno o de dos puntos.

            * `un_punto` - un_punto
            * `dos_puntos` - dos_puntos
        tamano_torneo:
          type: integer
          minimum: 2
          default: 3
          description: Solo con seleccion=torneo; <= población.
        inicializacion:
          allOf:
          - $ref: '#/components/schemas/InicializacionEnum'
          default: aleatoria
          description: |-
            aleatoria (línea base) o heuristica (parte de la población sesgada hacia rutas baratas).

            * `aleatoria` - aleatoria
            * `heuristica` - heuristica
    ConfigAGRequest:
      type: object
      properties:
        poblacion:
          type: integer
          maximum: 300
          minimum: 2
          default: 60
        generaciones:
          type: integer
          maximum: 1000
          minimum: 1
          default: 150
        cruce:
          type: number
          format: double
          maximum: 1
          minimum: 0
          default: 0.8
          description: Probabilidad de cruce por pareja.
        mutacion:
          type: number
          format: double
          maximum: 1
          minimum: 0
          default: 0.12
          description: Probabilidad de mutación por gen.
        semilla:
          type: integer
          maximum: 2147483647
          minimum: 0
          default: 42
        elitismo:
          type: integer
          minimum: 0
          default: 2
          description: Individuos que pasan intactos; < población.
        seleccion:
          allOf:
          - $ref: '#/components/schemas/SeleccionEnum'
          default: torneo
          description: |-
            torneo: gana el mejor de tamano_torneo individuos; ruleta: proporcional a la aptitud (con escalamiento).

            * `torneo` - torneo
            * `ruleta` - ruleta
        tipo_cruce:
          allOf:
          - $ref: '#/components/schemas/TipoCruceEnum'
          default: un_punto
          description: |-
            Cruce de uno o de dos puntos.

            * `un_punto` - un_punto
            * `dos_puntos` - dos_puntos
        tamano_torneo:
          type: integer
          minimum: 2
          default: 3
          description: Solo con seleccion=torneo; <= población.
        inicializacion:
          allOf:
          - $ref: '#/components/schemas/InicializacionEnum'
          default: aleatoria
          description: |-
            aleatoria (línea base) o heuristica (parte de la población sesgada hacia rutas baratas).

            * `aleatoria` - aleatoria
            * `heuristica` - heuristica
    DemoCarga:
      type: object
      properties:
        cargado:
          type: boolean
          description: Existen empresas o plantas FICTICIAS de demostración.
        empresas:
          type: integer
        plantas:
          type: integer
        rutas:
          type: integer
        ficticio:
          type: boolean
        detail:
          type: string
      required:
      - cargado
      - detail
      - empresas
      - ficticio
      - plantas
      - rutas
    DemoEstado:
      type: object
      properties:
        cargado:
          type: boolean
          description: Existen empresas o plantas FICTICIAS de demostración.
      required:
      - cargado
    DistanciaFuenteEnum:
      enum:
      - carretera
      - estimada
      - manual
      type: string
      description: |-
        * `carretera` - Por carretera (OSRM/OpenStreetMap)
        * `estimada` - Estimada (línea recta x 1,3)
        * `manual` - Ingresada manualmente
    EjecucionDetalle:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        metodo:
          allOf:
          - $ref: '#/components/schemas/MetodoEnum'
          readOnly: true
        estado:
