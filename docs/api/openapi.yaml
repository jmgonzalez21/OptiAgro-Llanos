          title: Nombre
          maxLength: 150
        last_name:
          type: string
          title: Apellidos
          maxLength: 150
        email:
          type: string
          format: email
          default: ''
        rol:
          allOf:
          - $ref: '#/components/schemas/RolEnum'
          default: analista
        activo:
          type: boolean
          default: true
      required:
      - password
      - username
    UsuarioGestion:
      type: object
      description: Usuario tal como lo ve el administrador. Nunca incluye contraseña
        ni hash.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
        first_name:
          type: string
          readOnly: true
          title: Nombre
        last_name:
          type: string
          readOnly: true
          title: Apellidos
        nombre_completo:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Dirección de correo electrónico
        rol:
          allOf:
          - $ref: '#/components/schemas/RolEnum'
          readOnly: true
        activo:
          type: boolean
          readOnly: true
        ultimo_acceso:
          type: string
          format: date-time
          readOnly: true
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
      required:
      - activo
      - email
      - fecha_creacion
      - first_name
      - id
      - last_name
      - nombre_completo
      - rol
      - ultimo_acceso
      - username
    VariacionRequest:
      type: object
      properties:
        tipo:
          allOf:
          - $ref: '#/components/schemas/TipoEnum'
          description: |-
            oferta | capacidad (cuello de botella si es negativa; varias plantas a la vez) | costo (transporte de rutas) | combustible (% sobre la tarifa km-ton de las rutas).

            * `oferta` - oferta
            * `capacidad` - capacidad
            * `costo` - costo
            * `combustible` - combustible
        ids:
          type: array
          items:
            type: string
            minLength: 1
          description: 'Códigos afectados: empresas (oferta), plantas (capacidad)
            o rutas ''E1->P2'' (costo, combustible). Vacío = todos. Para ''varias
            plantas'' liste sus códigos.'
        porcentajes:
          type: array
          items:
            type: number
            format: double
            maximum: 1000
            minimum: -100
          description: Variaciones porcentuales; cada una genera un escenario reoptimizado.
          maxItems: 40
          minItems: 1
      required:
      - porcentajes
      - tipo
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Autenticación JWT, perfil propio y cambio de contraseña.
- name: usuarios
  description: Gestión de usuarios (solo administrador).
- name: red
  description: Empresas, plantas, rutas y matriz de costos.
- name: optimizacion
  description: Ejecución de solvers, sensibilidad y reporte comparativo.
- name: escenarios
  description: Escenarios guardados.
- name: ejecuciones
  description: Historial de ejecuciones.
- name: demo
  description: Datos de demostración FICTICIOS.
