openapi: 3.0.3
info:
  title: OptiAgro-Llanos API
  version: 1.0.0
  description: 'API REST de optimización de la red logística de residuos agropecuarios
    (modelo de transporte exacto con HiGHS y algoritmo genético). Contrato entre backend
    y frontend. Unidades: toneladas por semana, costos en COP. Autenticación: JWT
    en la cabecera ''Authorization: Bearer <access>''. Errores 400: {"detail": str,
    "errores": lista|dict}.'
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      summary: Iniciar sesión (JWT)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginRespuesta'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Devuelve un access nuevo y un refresh NUEVO; el refresh enviado
        queda en lista negra. Guarde siempre el refresh más reciente. Un refresh vencido,
        revocado o de un usuario desactivado responde 401.
      summary: Renovar el token de acceso (el refresh rota)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshRespuesta'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Pone el refresh en lista negra. Un refresh inválido, vencido o
        ya revocado responde 400.
      summary: Cerrar sesión (revoca el refresh token)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Usuario autenticado y su rol
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
    patch:
      operationId: auth_me_partial_update
      summary: Editar el propio perfil (nombre, apellido, email)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPerfilActualizarRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/cambiar-contrasena/:
    post:
      operationId: auth_cambiar_contrasena_create
      description: Exige la contraseña actual y valida la nueva con los validadores
        de Django (mínimo 10 caracteres, no común, no solo numérica, no parecida a
        los datos del usuario). Revoca todas las sesiones (refresh) anteriores y devuelve
        un par de tokens nuevo para continuar la sesión.
      summary: Cambiar la propia contraseña
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarContrasenaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CambiarContrasenaRespuesta'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/demo/estado/:
    get:
      operationId: demo_estado_retrieve
      summary: ¿Están cargados los datos demo FICTICIOS?
      tags:
      - demo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoEstado'
          description: ''
  /api/v1/demo/cargar/:
    post:
      operationId: demo_cargar_create
      description: Crea 10 empresas, 4 plantas y 40 rutas FICTICIAS (marcadas ficticio=true).
        Si ya estaban cargadas no modifica nada y responde 200; si las crea, 201.
      summary: Cargar los datos de demostración FICTICIOS (administrador, idempotente)
      tags:
      - demo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoCarga'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoCarga'
          description: ''
  /api/v1/red/matriz-costos/:
    get:
      operationId: red_matriz_costos_retrieve
      summary: Matriz de costos empresa x planta
      tags:
      - red
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrizCostos'
          description: ''
    put:
      operationId: red_matriz_costos_update
      description: 'Crea o actualiza rutas por par (empresa, planta). Solo se modifican
        los campos enviados; un costo_unitario sin distancia/tarifa anula la distancia/tarifa
        previas. Es atómico: si una celda es inválida no se aplica ninguna.'
      summary: Actualización masiva de la matriz de costos (administrador)
      tags:
      - red
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatrizCostosEscrituraRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrizCostos'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/optimizacion/exacto/:
    post:
      operationId: optimizacion_exacto_create
      description: Resuelve el modelo de transporte. Un estado INFEASIBLE se devuelve
        con 200; entradas inválidas con 400.
      summary: Ejecutar el método exacto (LP, HiGHS)
      tags:
      - optimizacion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EjecutarExactoRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EjecucionResultado'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/optimizacion/genetico/:
    post:
      operationId: optimizacion_genetico_create
      description: 'Solo modo base (oferta exacta, plantas con capacidad máxima).
        Parámetros ajustables: población, generaciones, cruce, mutación, semilla y
        elitismo. Con la misma semilla el resultado es reproducible.'
      summary: Ejecutar el algoritmo genético
      tags:
      - optimizacion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EjecutarGeneticoRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EjecucionResultado'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/optimizacion/sensibilidad/:
    post:
      operationId: optimizacion_sensibilidad_create
      description: Varía porcentualmente la oferta de empresas, la capacidad de una
        o varias plantas, o los costos de rutas, reoptimiza cada escenario y devuelve
        los precios sombra (duales) del caso base, el análisis de cuellos de botella
        por planta, los RANGOS de variación (ranging de HiGHS) de ofertas, capacidades
        y costos de ruta, y la tabla de escenarios. Cada escenario se resuelve con
        el exacto y, por defecto (incluir_ag=true), también con el AG; incluye gap
        %, tiempos, cambio de asignaciones y si la base óptima cambió (base_cambio).
      summary: 'Análisis de sensibilidad: precios sombra, rangos y escenarios (exacto
        + AG)'
      tags:
      - optimizacion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensibilidadSolicitudRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EjecucionSensibilidad'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/optimizacion/reporte/:
    post:
      operationId: optimizacion_reporte_create
      description: Resuelve con ambos métodos y compara costo, tiempo y gap % ((AG
        - exacto)/exacto x 100). Opcionalmente incluye el comportamiento de ambos
        bajo escenarios de sensibilidad.
      summary: Reporte comparativo exacto vs AG
      tags:
      - optimizacion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReporteSolicitudRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EjecucionReporte'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/optimizacion/escalabilidad/:
    post:
      operationId: optimizacion_escalabilidad_create
      description: 'Genera redes sintéticas FICTICIAS y deterministas de tamaños crecientes
        (por defecto 10x4, 20x6, 40x10 y 80x16 empresas x plantas), resuelve cada
        una con el método exacto y con el AG y compara tiempo, costo y gap %. Los
        tamaños y el trabajo total del AG están acotados (OPTIAGRO_ESCALABILIDAD_*):
        si se exceden, 400. No usa ni modifica la red guardada.'
      summary: Prueba de escalabilidad (redes sintéticas, exacto vs AG)
      tags:
      - optimizacion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalabilidadSolicitudRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EjecucionEscalabilidad'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/empresas/:
    get:
      operationId: empresas_list
      description: Si cambian las coordenadas del nodo, recalcula sus rutas carretera/estimada
        (las manuales se respetan).
      summary: Listar empresas
      parameters:
      - in: query
        name: activa
        schema:
          type: boolean
        description: Filtra por estado activo.
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - red
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmpresaList'
          description: ''
    post:
      operationId: empresas_create
      description: Si cambian las coordenadas del nodo, recalcula sus rutas carretera/estimada
        (las manuales se respetan).
      summary: Crear empresa (administrador)
      tags:
      - red
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
          description: ''
  /api/v1/empresas/{id}/:
    get:
      operationId: empresas_retrieve
      description: Si cambian las coordenadas del nodo, recalcula sus rutas carretera/estimada
        (las manuales se respetan).
      summary: Detalle de empresa
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este empresa.
        required: true
      tags:
      - red
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
          description: ''
    put:
      operationId: empresas_update
      description: Si cambian las coordenadas del nodo, recalcula sus rutas carretera/estimada
        (las manuales se respetan).
      summary: Reemplazar empresa (administrador)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este empresa.
        required: true
      tags:
      - red
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
          description: ''
    patch:
      operationId: empresas_partial_update
      description: Si cambian las coordenadas del nodo, recalcula sus rutas carretera/estimada
        (las manuales se respetan).
      summary: Editar empresa (administrador)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este empresa.
        required: true
      tags:
      - red
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmpresaRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
          description: ''
    delete:
      operationId: empresas_destroy
      description: Si cambian las coordenadas del nodo, recalcula sus rutas carretera/estimada
        (las manuales se respetan).
      summary: Eliminar empresa y sus rutas (administrador)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este empresa.
        required: true
      tags:
      - red
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/plantas/:
    get:
      operationId: plantas_list
      description: Si cambian las coordenadas del nodo, recalcula sus rutas carretera/estimada
        (las manuales se respetan).
      summary: Listar plantas
      parameters:
      - in: query
        name: activa
        schema:
          type: boolean
        description: Filtra por estado activo.
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - red
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlantaList'
          description: ''
    post:
      operationId: plantas_create
      description: Si cambian las coordenadas del nodo, recalcula sus rutas carretera/estimada
        (las manuales se respetan).
      summary: Crear planta (administrador)
      tags:
      - red
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Planta'
          description: ''
  /api/v1/plantas/{id}/:
    get:
      operationId: plantas_retrieve
      description: Si cambian las coordenadas del nodo, recalcula sus rutas carretera/estimada
        (las manuales se respetan).
      summary: Detalle de planta
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este planta.
        required: true
      tags:
      - red
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Planta'
          description: ''
    put:
      operationId: plantas_update
      description: Si cambian las coordenadas del nodo, recalcula sus rutas carretera/estimada
        (las manuales se respetan).
      summary: Reemplazar planta (administrador)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este planta.
        required: true
      tags:
      - red
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Planta'
          description: ''
    patch:
      operationId: plantas_partial_update
      description: Si cambian las coordenadas del nodo, recalcula sus rutas carretera/estimada
        (las manuales se respetan).
      summary: Editar planta (administrador)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este planta.
        required: true
      tags:
      - red
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPlantaRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Planta'
          description: ''
    delete:
      operationId: plantas_destroy
      description: Si cambian las coordenadas del nodo, recalcula sus rutas carretera/estimada
        (las manuales se respetan).
      summary: Eliminar planta y sus rutas (administrador)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este planta.
        required: true
      tags:
      - red
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/rutas/:
    get:
      operationId: rutas_list
      summary: Listar rutas
      parameters:
      - in: query
        name: activa
        schema:
          type: boolean
        description: Filtra por estado activo.
      - in: query
        name: empresa
        schema:
          type: string
        description: Código de empresa.
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: planta
        schema:
          type: string
        description: Código de planta.
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - red
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRutaList'
          description: ''
    post:
      operationId: rutas_create
      summary: Crear ruta (administrador)
      tags:
      - red
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RutaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruta'
          description: ''
  /api/v1/rutas/recalcular-distancias/:
    post:
      operationId: rutas_recalcular_distancias_create
      description: Consulta OSRM (tabla de distancias por lotes) y actualiza distancia_km
        y el costo efectivo. Por defecto solo toca rutas con distancia_fuente carretera/estimada;
        las manuales se respetan salvo incluir_manuales=true. Si OSRM falla se usa
        el respaldo (línea recta x 1,3) y se informa en aviso.
      summary: Recalcular distancias por carretera (administrador)
      tags:
      - red
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecalcularDistanciasRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecalcularDistanciasRespuesta'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/rutas/trayectos/:
    get:
      operationId: rutas_trayectos_retrieve
      summary: Trayectos de varias rutas (máx. 30)
      parameters:
      - in: query
        name: ids
        schema:
          type: string
        description: IDs separados por coma, p. ej. 1,2,3.
        required: true
      tags:
      - red
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrayectosRespuesta'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/rutas/{id}/:
    get:
      operationId: rutas_retrieve
      summary: Detalle de ruta
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este ruta.
        required: true
      tags:
      - red
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
